[project]
name = "llm-society-sim"
version = "0.1.0.dev0"
description = "Measuring misinformation cascade dynamics in LLM agent societies"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "scipy>=1.12",
    "pandas>=2.2",
    "networkx>=3.2",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Frailty models (AMD-0002 SS8.1). Without these the pipeline uses the documented fallback:
# the same fit with cluster-robust standard errors (AMD-0002 SS8.5).
mixed = ["statsmodels>=0.14", "lifelines>=0.28"]
dev = ["pytest>=8", "pytest-cov", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: Monte Carlo validation; deselect with -m 'not slow'"]

[tool.ruff]
line-length = 95
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
